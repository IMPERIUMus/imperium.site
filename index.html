<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>IMPERIUM — визуальная лента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Tangerine:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep: #060A14;
    --navy: #0B1220;
    --blush: #D8B9AC;
    --blush-light: #EAD8CE;
    --ink: #F1ECE6;
    --ink-dim: #A9AEBB;
    --line: rgba(216,185,172,0.22);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    color:var(--ink);
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:18px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 500px at 12% -6%, rgba(216,185,172,0.08), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(0,0,0,0.55), transparent 55%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    background-attachment:fixed;
  }
  a{ color:inherit; text-decoration:none; }
  h1,h2,.nav-name{ font-family:'Playfair Display', Georgia, serif; }

  .intro-gate{
    position:fixed; inset:0; z-index:400;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px;
    background:
      radial-gradient(1000px 600px at 50% 32%, rgba(216,185,172,0.10), transparent 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    --gcx:50%; --gcy:50%;
    clip-path:circle(150% at var(--gcx) var(--gcy));
    transition:clip-path 1.25s cubic-bezier(.65,0,.35,1);
  }
  .intro-gate.hidden{ clip-path:circle(0% at var(--gcx) var(--gcy)); pointer-events:none; }
  @keyframes introBreathe{
    0%,100%{ transform:scale(1); filter:drop-shadow(0 0 22px rgba(216,185,172,0.25)); }
    50%{ transform:scale(1.06); filter:drop-shadow(0 0 38px rgba(216,185,172,0.4)); }
  }
  .intro-flower-btn{
    background:none; border:none; padding:0; cursor:pointer;
    width:min(62vw,300px); height:min(62vw,300px);
    animation:introBreathe 3.4s ease-in-out infinite;
    transition:transform .6s cubic-bezier(.4,0,.2,1), opacity .6s ease, filter .6s ease;
  }
  .intro-flower-btn svg{ width:100%; height:100%; display:block; }
  .intro-flower-btn.shedding{ animation:none; transform:scale(0.7) rotate(24deg); opacity:0; filter:blur(2px); }
  .intro-hint{
    font-family:'Cormorant Garamond', Georgia, serif; font-style:italic;
    color:var(--ink-dim); font-size:17px; letter-spacing:0.05em; opacity:0.85;
    animation:fadeUp 1s ease; transition:opacity .4s ease;
  }
  .intro-hint.fading{ opacity:0; }
  @media (max-width:600px){ .intro-flower-btn{ width:min(64vw,240px); height:min(64vw,240px); } }
  @media (prefers-reduced-motion:reduce){ .intro-flower-btn{ animation:none !important; } }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:translateY(0); } }

  .orb{ position:fixed; border-radius:50%; filter:blur(60px); pointer-events:none; z-index:0; opacity:0.4; }
  .orb1{ width:420px; height:420px; top:-10%; left:-8%; background:radial-gradient(circle, rgba(216,185,172,0.35), transparent 70%); animation:driftA 22s ease-in-out infinite; }
  .orb2{ width:360px; height:360px; top:40%; right:-10%; background:radial-gradient(circle, rgba(216,185,172,0.22), transparent 70%); animation:driftB 26s ease-in-out infinite; }
  @keyframes driftA{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(60px,40px) scale(1.1); } }
  @keyframes driftB{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-50px,-30px) scale(1.15); } }
  @media (prefers-reduced-motion:reduce){ .orb{ animation:none !important; } }

  .nav{
    position:sticky; top:0; z-index:200;
    background:rgba(6,10,20,0.78);
    backdrop-filter:saturate(160%) blur(16px); -webkit-backdrop-filter:saturate(160%) blur(16px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{ max-width:1200px; margin:0 auto; padding:0 20px; height:60px; display:flex; align-items:center; justify-content:space-between; }
  .nav-name{
    font-size:16px; font-weight:600; letter-spacing:0.14em; display:flex; align-items:center; gap:9px;
    background-image:linear-gradient(90deg, var(--blush) 0%, var(--blush-light) 25%, #fff 50%, var(--blush-light) 75%, var(--blush) 100%);
    background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:shimmerText 6s linear infinite;
  }
  .nav-name svg{ width:16px; height:16px; -webkit-text-fill-color:initial; }
  @keyframes shimmerText{ to{ background-position:200% center; } }
  .nav-tag{ font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:13.5px; color:var(--ink-dim); }

  .gallery-header{ text-align:center; padding:56px 20px 34px; position:relative; }
  .gh-eyebrow{
    font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:15px;
    color:var(--blush); margin-bottom:8px;
    opacity:0; transform:translateY(16px); transition:opacity .8s ease .05s, transform .8s ease .05s;
  }
  .gh-title{
    font-family:'Tangerine', cursive; font-weight:700; font-size:clamp(60px,11vw,110px);
    line-height:1; color:var(--blush-light);
    text-shadow:0 4px 30px rgba(216,185,172,0.3);
    opacity:0; transform:translateY(16px); transition:opacity .8s ease .18s, transform .8s ease .18s;
  }
  .gh-sub{
    margin:12px auto 0; max-width:44ch; font-size:17px; font-style:italic; color:var(--ink-dim);
    opacity:0; transform:translateY(16px); transition:opacity .8s ease .32s, transform .8s ease .32s;
  }
  .gallery-header.revealed .gh-eyebrow,
  .gallery-header.revealed .gh-title,
  .gallery-header.revealed .gh-sub{ opacity:1; transform:translateY(0); }

  .masonry{
    column-count:2; column-gap:14px;
    padding:0 16px 20px; position:relative; z-index:1;
    max-width:1200px; margin:0 auto;
  }
  @media (min-width:640px){ .masonry{ column-count:3; column-gap:16px; } }
  @media (min-width:980px){ .masonry{ column-count:4; column-gap:18px; } }
  @media (min-width:1300px){ .masonry{ column-count:5; } }

  .tile{
    break-inside:avoid; margin-bottom:14px; position:relative;
    border-radius:6px; overflow:hidden; cursor:pointer;
    box-shadow:0 10px 26px rgba(0,0,0,0.35);
    opacity:0; transform:translateY(24px) scale(0.98);
    transition:opacity .6s ease, transform .6s ease, box-shadow .35s ease;
    background:var(--navy);
  }
  @media (min-width:980px){ .tile{ margin-bottom:18px; } }
  .tile.in-view{ opacity:1; transform:translateY(0) scale(1); }
  .tile-art{
    width:100%; height:auto; display:block; position:relative;
    transition:transform .6s cubic-bezier(.2,.8,.3,1);
  }
  .tile:hover{ box-shadow:0 20px 44px rgba(0,0,0,0.5); }
  .tile:hover .tile-art{ transform:scale(1.06); }

  .tile-shade{
    position:absolute; inset:0;
    background:linear-gradient(0deg, rgba(6,9,17,0.55) 0%, transparent 45%);
    opacity:0; transition:opacity .35s ease;
  }
  .tile:hover .tile-shade{ opacity:1; }

  .tile-pin{
    position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%;
    background:rgba(6,9,17,0.55); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; color:var(--blush-light);
    opacity:0; transform:translateY(-6px) scale(0.85);
    transition:opacity .3s ease, transform .3s ease, background .25s ease;
  }
  .tile:hover .tile-pin{ opacity:1; transform:translateY(0) scale(1); }
  .tile-pin:hover{ background:var(--blush); color:#1A1210; }
  .tile-pin svg{ width:14px; height:14px; }

  .flower-interactive{
    cursor:pointer;
    transition:transform .4s cubic-bezier(.2,1.4,.4,1), filter .4s ease;
  }
  .flower-interactive:hover{ transform:scale(1.1); filter:drop-shadow(0 0 14px rgba(216,185,172,0.5)); }

  .petal-particle{
    position:fixed; width:14px; height:18px; pointer-events:none; z-index:9999;
    background:var(--blush); border-radius:60% 10% 60% 10%; opacity:0.9;
    animation:petalFall 1.4s ease-out forwards;
  }
  @keyframes petalFall{
    0%{ transform:translate(0,0) rotate(0deg) scale(1); opacity:0.9; }
    100%{ transform:var(--pf-end) rotate(var(--pf-rot)) scale(0.5); opacity:0; }
  }

  .feed-loader{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:36px 20px 60px; color:var(--ink-dim);
    font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:15px;
    opacity:0; transition:opacity .3s ease;
  }
  .feed-loader.visible{ opacity:1; }
  .loader-flower{ width:20px; height:20px; animation:spin 1.1s linear infinite; }
  .loader-flower svg{ width:100%; height:100%; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #scrollSentinel{ height:1px; }

  @media (prefers-reduced-motion:reduce){
    html{ scroll-behavior:auto; }
    .intro-gate{ transition:none !important; }
    .gh-eyebrow,.gh-title,.gh-sub,.tile{ transition:none !important; opacity:1 !important; transform:none !important; }
    .loader-flower{ animation:none !important; }
  }
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="flower-full" viewBox="0 0 100 100">
    <g transform="rotate(0 50 50)"><path fill="#D8B9AC" opacity="0.85" d="M50 50 C41 42 39 24 50 6 C61 24 59 42 50 50 Z"/></g>
    <g transform="rotate(45 50 50)"><path fill="#D8B9AC" opacity="0.85" d="M50 50 C41 42 39 24 50 6 C61 24 59 42 50 50 Z"/></g>
    <g transform="rotate(90 50 50)"><path fill="#D8B9AC" opacity="0.85" d="M50 50 C41 42 39 24 50 6 C61 24 59 42 50 50 Z"/></g>
    <g transform="rotate(135 50 50)"><path fill="#D8B9AC" opacity="0.85" d="M50 50 C41 42 39 24 50 6 C61 24 59 42 50 50 Z"/></g>
    <g transform="rotate(180 50 50)"><path fill="#D8B9AC" opacity="0.85" d="M50 50 C41 42 39 24 50 6 C61 24 59 42 50 50 Z"/></g>
    <g transform="rotate(225 50 50)"><path fill="#D8B9AC" opacity="0.85" d="M50 50 C41 42 39 24 50 6 C61 24 59 42 50 50 Z"/></g>
    <g transform="rotate(270 50 50)"><path fill="#D8B9AC" opacity="0.85" d="M50 50 C41 42 39 24 50 6 C61 24 59 42 50 50 Z"/></g>

    <g transform="rotate(112.5 50 50)"><path fill="#EAD8CE" opacity="0.92" d="M50 50 C44 45 43 32 50 18 C57 32 56 45 50 50 Z"/></g>
    <g transform="rotate(157.5 50 50)"><path fill="#EAD8CE" opacity="0.92" d="M50 50 C44 45 43 32 50 18 C57 32 56 45 50 50 Z"/></g>

</svg>

<div class="intro-gate" id="introGate">
  <button class="intro-flower-btn" id="introFlowerBtn" aria-label="Открыть сайт">
    <svg viewBox="0 0 100 100"><use href="#flower-full"/></svg>
  </button>
  <div class="intro-hint" id="introHint">Нажмите на цветок</div>
</div>

<div class="orb orb1" aria-hidden="true"></div>
<div class="orb orb2" aria-hidden="true"></div>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-name">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3c1.6 1.3 2.4 2.8 2.4 4.2 0 1.6-1 2.8-2.4 2.8s-2.4-1.2-2.4-2.8C9.6 5.8 10.4 4.3 12 3z" stroke="currentColor" stroke-width="1.1"/>
        <path d="M12 21c-1.6-1.3-2.4-2.8-2.4-4.2 0-1.6 1-2.8 2.4-2.8s2.4 1.2 2.4 2.8c0 1.4-.8 2.9-2.4 4.2z" stroke="currentColor" stroke-width="1.1"/>
        <path d="M3 12c1.3-1.6 2.8-2.4 4.2-2.4 1.6 0 2.8 1 2.8 2.4s-1.2 2.4-2.8 2.4C5.8 14.4 4.3 13.6 3 12z" stroke="currentColor" stroke-width="1.1"/>
        <path d="M21 12c-1.3 1.6-2.8 2.4-4.2 2.4-1.6 0-2.8-1-2.8-2.4s1.2-2.4 2.8-2.4c1.4 0 2.9.8 4.2 2.4z" stroke="currentColor" stroke-width="1.1"/>
        <circle cx="12" cy="12" r="1.6" stroke="currentColor" stroke-width="1.1"/>
      </svg>
      IMPERIUM
    </div>
    <div class="nav-tag">визуальная лента</div>
  </div>
</nav>

<header class="gallery-header" id="galleryHeader">
  <div class="gh-eyebrow">Бесконечный мудборд</div>
  <div class="gh-title">Imperium</div>
  <p class="gh-sub">Листайте вниз — лента пополняется новыми образами без конца.</p>
</header>

<div class="masonry" id="masonry"></div>

<div class="feed-loader" id="feedLoader">
  <span class="loader-flower"><svg viewBox="0 0 100 100"><use href="#flower-full"/></svg></span>
  Подгружаю ещё…
</div>
<div id="scrollSentinel"></div>

<script>
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var introGate = document.getElementById('introGate');
  var introFlowerBtn = document.getElementById('introFlowerBtn');
  var introHint = document.getElementById('introHint');
  var galleryHeader = document.getElementById('galleryHeader');

  if (introGate && introFlowerBtn) {
    introFlowerBtn.addEventListener('click', function(){
      if (introFlowerBtn.classList.contains('shedding')) return;
      introFlowerBtn.classList.add('shedding');
      if (introHint) introHint.classList.add('fading');
      setTimeout(function(){
        introGate.classList.add('hidden');
        if (galleryHeader) galleryHeader.classList.add('revealed');
      }, reduceMotion ? 150 : 700);
    });
  }

  var masonry = document.getElementById('masonry');
  var feedLoader = document.getElementById('feedLoader');
  var sentinel = document.getElementById('scrollSentinel');
  var seedCounter = 1;
  var totalLoaded = 0;
  var MAX_TILES = 400;
  var loading = false;

  function spawnPetals(cx, cy, count){
    for (var i = 0; i < count; i++){
      var p = document.createElement('div');
      p.className = 'petal-particle';
      var angle = Math.random() * Math.PI * 2;
      var dist = 60 + Math.random() * 90;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist + 80 + Math.random() * 60;
      var rot = (Math.random() * 360 - 180).toFixed(0) + 'deg';
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.setProperty('--pf-end', 'translate(' + dx.toFixed(0) + 'px,' + dy.toFixed(0) + 'px)');
      p.style.setProperty('--pf-rot', rot);
      p.style.animationDuration = (1.1 + Math.random() * 0.6) + 's';
      document.body.appendChild(p);
      p.addEventListener('animationend', function(){ this.remove(); });
    }
  }

  var ratios = [
    [400,520],[400,600],[400,460],[400,680],[400,400],
    [400,560],[400,640],[400,500],[400,720],[400,440]
  ];

  var palettes = [
    ['#2A2140','#4A2E4E'], ['#3A2118','#6A4326'], ['#1E2A44','#3A4E6E'],
    ['#4A1F2E','#7A3A4E'], ['#1F3A34','#3A6E5A'], ['#3A2A14','#6E5426'],
    ['#241832','#4E2E5E'], ['#142A2E','#2E5E5A'], ['#3E1A24','#7A3346'],
    ['#1A2438','#3A5478']
  ];

  var photoIds = [
    '1417325384643-aac51acc9e5d',
    '1634482895955-712847090dfd',
    '1543877087-ebf71fde2be1',
    '1501265976582-c1e1b0bbaf63',
    '1496108493338-3b30de66f9be',
    '1461783470466-185038239ee3',
    '1562239711-f353a425d023'
  ];

  var pixabayUrls = [
    'https://cdn.pixabay.com/photo/2020/11/01/19/41/autumn-5704791_1280.jpg',
    'https://cdn.pixabay.com/photo/2020/07/27/02/30/hands-5441201_1280.jpg',
    'https://cdn.pixabay.com/photo/2020/11/08/09/41/deer-5723225_1280.jpg',
    'https://cdn.pixabay.com/photo/2020/11/15/22/08/person-5747420_960_720.jpg',
    'https://cdn.pixabay.com/photo/2020/09/27/04/15/cat-5605615_960_720.jpg',
    'https://cdn.pixabay.com/photo/2020/03/14/21/56/wine-4931923_1280.jpg',
    'https://cdn.pixabay.com/photo/2020/04/19/12/26/thread-5063401_1280.jpg',
    'https://cdn.pixabay.com/photo/2020/07/11/11/34/mam-tor-5393685_1280.jpg',
    'https://cdn.pixabay.com/photo/2020/07/03/14/43/waterdrops-5366584_1280.jpg'
  ];

  var revealObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08 });

  function fillAbstractArt(art, r){
    var pal = palettes[Math.floor(Math.random() * palettes.length)];
    var angle = 110 + Math.floor(Math.random() * 100);
    art.style.background =
      'radial-gradient(circle at ' + (20 + Math.random()*60).toFixed(0) + '% ' + (20 + Math.random()*60).toFixed(0) + '%, rgba(216,185,172,0.22), transparent 60%), ' +
      'linear-gradient(' + angle + 'deg, ' + pal[0] + ' 0%, ' + pal[1] + ' 100%)';

    var deco = Math.random();
    if (deco < 0.22) {
      art.innerHTML = '<svg class="flower-interactive" style="width:56%;opacity:0.85;" viewBox="0 0 100 100"><use href="#flower-full"/></svg>';
      art.style.display = 'flex'; art.style.alignItems = 'center'; art.style.justifyContent = 'center';
      var newFlower = art.querySelector('.flower-interactive');
      if (newFlower) {
        newFlower.addEventListener('click', function(e){
          e.stopPropagation();
          var rr = newFlower.getBoundingClientRect();
          spawnPetals(rr.left + rr.width/2, rr.top + rr.height/2, 8);
        });
      }
    } else if (deco < 0.4) {
      var letters = ['I','M','P','E','R'];
      var letter = letters[Math.floor(Math.random()*letters.length)];
      art.innerHTML = '<span style="font-family:\'Tangerine\',cursive;font-weight:700;font-size:38%;color:rgba(234,216,206,0.85);">' + letter + '</span>';
      art.style.display = 'flex'; art.style.alignItems = 'center'; art.style.justifyContent = 'center';
    } else if (deco < 0.58) {
      var lines = '';
      for (var li = 0; li < 5; li++){
        var y1 = 20 + li*45, y2 = y1 - 30;
        lines += '<path d="M0 ' + y1 + ' Q100 ' + y2 + ' 200 ' + y1 + '" stroke="rgba(216,185,172,0.5)" stroke-width="1" fill="none"/>';
      }
      art.innerHTML = '<svg viewBox="0 0 200 240" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.6;">' + lines + '</svg>';
    } else {
      art.innerHTML = '';
    }
  }

  function makeTile(){
    var r = ratios[Math.floor(Math.random() * ratios.length)];
    var tile = document.createElement('div');
    tile.className = 'tile';

    var art = document.createElement('div');
    art.className = 'tile-art';
    art.style.aspectRatio = r[0] + ' / ' + r[1];
    art.style.background = '#141926';

    var wantsPhoto = Math.random() < 0.7;

    if (wantsPhoto) {
      var useUnsplash = Math.random() < 0.55;
      var photoUrl;
      if (useUnsplash) {
        var pid = photoIds[Math.floor(Math.random() * photoIds.length)];
        var crops = ['entropy', 'faces', 'edges', 'focalpoint'];
        var crop = crops[Math.floor(Math.random() * crops.length)];
        photoUrl = 'https://images.unsplash.com/photo-' + pid +
          '?auto=format&fit=crop&crop=' + crop + '&w=' + r[0] + '&h=' + r[1] + '&q=70';
      } else {
        photoUrl = pixabayUrls[Math.floor(Math.random() * pixabayUrls.length)];
      }

      var img = document.createElement('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.alt = '';
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.objectFit = 'cover';
      img.style.display = 'block';
      img.style.position = 'absolute';
      img.style.inset = '0';

      img.addEventListener('error', function(){
        img.remove();
        fillAbstractArt(art, r);
      });

      img.src = photoUrl;
      art.style.position = 'relative';
      art.appendChild(img);
    } else {
      fillAbstractArt(art, r);
    }

    var shade = document.createElement('div');
    shade.className = 'tile-shade';

    var pin = document.createElement('div');
    pin.className = 'tile-pin';
    pin.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18M12 3l-5 5M12 3l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    tile.appendChild(art);
    tile.appendChild(shade);
    tile.appendChild(pin);

    return tile;
  }

  function loadBatch(count){
    if (loading || totalLoaded >= MAX_TILES) return;
    loading = true;
    if (feedLoader) feedLoader.classList.add('visible');

    var frag = document.createDocumentFragment();
    var newTiles = [];
    for (var i = 0; i < count && totalLoaded < MAX_TILES; i++){
      var tile = makeTile();
      frag.appendChild(tile);
      newTiles.push(tile);
      totalLoaded++;
    }
    masonry.appendChild(frag);

    newTiles.forEach(function(t, i){
      if (reduceMotion) {
        t.classList.add('in-view');
      } else {
        t.style.transitionDelay = (i % 6) * 0.05 + 's';
        revealObserver.observe(t);
      }
    });

    setTimeout(function(){
      loading = false;
      if (feedLoader) feedLoader.classList.remove('visible');
      if (totalLoaded >= MAX_TILES && feedLoader) {
        feedLoader.textContent = 'Вы посмотрели всю ленту на сегодня ✦';
        feedLoader.classList.add('visible');
      }
    }, 350);
  }

  loadBatch(18);

  var scrollObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting) loadBatch(12);
    });
  }, { rootMargin: '600px 0px 600px 0px' });
  if (sentinel) scrollObserver.observe(sentinel);
</script>

</body>
</html>
